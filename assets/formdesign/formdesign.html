<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="formdesign.css">

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="formdesign.js"></script>

    <title>Entrypoint Form</title>
</head>
<body>
    <form>
        <fieldset>
            <legend>North</legend>

            <strong>We represent directions pictorially for simplicity. All inputs are in vehicles per hour (vph):</strong>

            <div class="directions">
                <div class="north">
                    <label for="ninc"><strong>Incoming</strong> <em>Northbound</em>&#8595;:</label>
                    <input name="ninc" type="number" value="100">
                </div>
                <div class="east">
                    <label for="noute">Outgoing <em>Eastbound</em> &#8594;</label>
                    <input name="noute" type="number" value="35">
                </div>
                <div class="south">
                    <label for="nouts">Outgoing <em>Southbound</em> &#8595;</label>
                    <input name="nouts" type="number" value="35">
                </div>
                <div class="west">
                    <label for="nouts">Outgoing <em>Westbound</em> &#8592;</label>
                    <input name="nouts" type="number" value="30">
                </div>
            </div>

            <br>

            <div class="lanes">
                <div>
                    <label for="nnumlanesout"># of lanes <strong>outgoing:</strong></label>
                    <select id="nnumlanesout" name="nnumlanesout">
                        <option value="1">1</option>
                        <option value="2" selected>2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                    </select>
                </div>
            </div>

            <h3>Outgoing Lane Settings</h3>

            <table id="noutlanes"></table>

            <h3>General Settings</h3>

            <label for="npedcrossing">Is there a pedestrian crossing? </label>
            <input name="npedcrossing" id="npedcrossing" type="checkbox">
            
            <br>

            <label for="nbuscheckmark">Is there a bus/cycle lane?</label>
            <input name="nbuscheckmark" id="nbuscheckmark" type="checkbox">
        </fieldset>

        <fieldset>
            <legend>Submit Configuration</legend>

            <label for="usesim">Show Visualisation</label>
            <input name="usesim" type="checkbox">
            <br>
            <label for="trafficlight">What type of traffic light? </label>
            <select name="trafficlight" id="trafficlight">
                <option value="fixedcycle" selected>Fixed-cycle length</option>
                <option value="detection">Actuation</option>
            </select>

            <button id="edittrafficlight">Edit Settings</button>

            <div id="trafficlightmodal" class="modal">
                <div class="modal-content">
                    <span id="closetrafficlightmodal" class="close">&times;</span>

                    <div class="directions">
                        <div class="north">
                            <label for="ninc"><em>North</em>&#8595;:</label>
                            <input name="ninc" type="number" value="100">
                        </div>
                        <div class="east">
                            <label for="noute">Outgoing <em>Eastbound</em> &#8594;</label>
                            <input name="noute" type="number" value="35">
                        </div>
                        <div class="south">
                            <label for="nouts">Outgoing <em>Southbound</em> &#8595;</label>
                            <input name="nouts" type="number" value="35">
                        </div>
                        <div class="west">
                            <label for="nouts">Outgoing <em>Westbound</em> &#8592;</label>
                            <input name="nouts" type="number" value="30">
                        </div>
                    </div>
                </div>
            </div>

            <br><br>
            <input value="Confirm Configuration and Submit for Analysis" name="submit" type="submit">
            <button>Load Configuration</button>
            <button>Save Configuration</button>
        </fieldset>
    </form>
</body>
</html>
